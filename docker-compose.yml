services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wayfare
      POSTGRES_PASSWORD: wayfare
      POSTGRES_DB: wayfare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfare"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
